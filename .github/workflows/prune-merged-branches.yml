name: Prune safely merged branches
# FleetHacker standard: prune merged branches. ONE canonical copy:
# edge-ops templates/workflows/prune-merged-branches.yml. Copy it unchanged to
# .github/workflows/prune-merged-branches.yml; never edit it per repo.
# Windows PowerShell 5.1 on the self-hosted Windows runner (Windows runners require shell: powershell).
# Rule: delete a branch only if it is the head of a merged same-repo PR into the default branch
# and its tip is exactly that PR's merged head SHA. Any commit after the merge keeps it.
# Never: the default branch, main, master, protected, hub/ preview/ release/, an open PR's head or base.
# No stale, age-based or no-PR deletes. Manual runs default to dry_run (log only); push-to-main runs are live.
# Right before each delete the branch tip is re-read and the branch is kept if it moved.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log what would be deleted without deleting anything (uncheck to delete for real)
        type: boolean
        default: true
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: prune-branches
  cancel-in-progress: false
jobs:
  prune:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - name: Remove only fully merged, unchanged, same-repository branches
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $repo = $env:GH_REPOSITORY
          $dryRun = ($env:DRY_RUN -eq 'true')
          $root = 'https://api.github.com/repos/' + $repo
          $headers = @{ Authorization = 'Bearer ' + $env:GH_TOKEN; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          function Invoke-GhApi([string]$Path, [string]$Method = 'GET') {
            # Invoke-WebRequest + ConvertFrom-Json so arrays come back the same way in 5.1 and 7.
            $r = Invoke-WebRequest -UseBasicParsing -Uri ($root + $Path) -Method $Method -Headers $headers -TimeoutSec 30
            if ([string]::IsNullOrEmpty($r.Content)) { return $null }
            return (New-Object PSObject -Property @{ Raw = $r.Content; Json = ($r.Content | ConvertFrom-Json) })
          }
          function Get-HttpStatus($ErrRecord) {
            # 5.1 throws WebException, 7 throws HttpResponseException; both carry .Response.StatusCode.
            $resp = $ErrRecord.Exception.Response
            if ($null -eq $resp) { return 0 }
            try { return [int]$resp.StatusCode } catch { return 0 }
          }
          function Test-SameRepoHead($Pr, [string]$Name) {
            # A deleted fork leaves head.repo null: never a match, never an exception.
            if ($null -eq $Pr -or $null -eq $Pr.head) { return $false }
            if ($null -eq $Pr.head.repo) { return $false }
            return ([string]$Pr.head.ref -ceq $Name -and [string]$Pr.head.repo.full_name -ceq $repo)
          }
          function Get-GhPages([string]$Path) {
            # 50 per page, up to 40 pages (2000 items, as before). A 100-PR page can pass 2 MB,
            # which is near Windows PowerShell 5.1's ConvertFrom-Json size limit.
            $per = 50
            $list = New-Object System.Collections.Generic.List[object]
            for ($page = 1; $page -le 40; $page++) {
              $sep = '?'; if ($Path.Contains('?')) { $sep = '&' }
              $resp = Invoke-GhApi ($Path + $sep + 'per_page=' + $per + '&page=' + $page)
              if ($null -eq $resp -or -not $resp.Raw.TrimStart().StartsWith('[')) { throw "Unexpected GitHub API payload for $Path" }
              $n = 0
              foreach ($v in $resp.Json) { if ($null -ne $v) { $list.Add($v); $n++ } }
              if ($n -lt $per) { break }
            }
            return ,$list
          }
          $default = [string](Invoke-GhApi '').Json.default_branch
          if (-not $default) { throw 'Could not read the default branch' }
          $merged = Get-GhPages '/pulls?state=closed'
          $openPrs = Get-GhPages '/pulls?state=open'
          $branches = Get-GhPages '/branches'
          if ($dryRun) { Write-Host 'DRY RUN: nothing will be deleted' }
          Write-Host ("{0}: default branch '{1}', {2} branches, {3} open PRs, {4} closed PRs" -f $repo, $default, $branches.Count, $openPrs.Count, $merged.Count)
          foreach ($branch in $branches) {
            $name = [string]$branch.name
            # Git ref names are case-sensitive, so every comparison below is -ceq.
            if ($name -ceq $default -or $name -ceq 'main' -or $name -ceq 'master') { Write-Host "KEEP default branch: $name"; continue }
            if ($name.StartsWith('hub/') -or $name.StartsWith('preview/') -or $name.StartsWith('release/')) { Write-Host "KEEP hard-coded exclusion (hub/, preview/, release/): $name"; continue }
            if ($branch.protected -eq $true) { Write-Host "KEEP protected branch: $name"; continue }
            $sha = [string]$branch.commit.sha
            $open = @($openPrs | Where-Object { Test-SameRepoHead $_ $name })
            if ($open.Count -gt 0) { Write-Host "KEEP open PR: $name"; continue }
            $isBase = @($openPrs | Where-Object { $null -ne $_.base -and [string]$_.base.ref -ceq $name })
            if ($isBase.Count -gt 0) { Write-Host "KEEP base of an open PR (deleting it would close that PR): $name"; continue }
            $hits = @($merged | Where-Object { $_.merged_at -and $null -ne $_.base -and [string]$_.base.ref -ceq $default -and (Test-SameRepoHead $_ $name) -and [string]$_.head.sha -ceq $sha })
            if ($hits.Count -eq 0) { Write-Host "KEEP unverified or changed branch: $name"; continue }
            $mergedSha = [string]$hits[0].head.sha
            $enc = [uri]::EscapeDataString($name).Replace('%2F', '/')
            Write-Host ("PLAN delete {0} at {1} (merged PR #{2})" -f $name, $sha.Substring(0, [Math]::Min(7, $sha.Length)), $hits[0].number)
            if ($dryRun) { Write-Host "DRY RUN would delete: $name"; continue }
            # Re-read the tip right before deleting; keep the branch if anything moved it.
            $tip = $null
            try { $tip = [string](Invoke-GhApi ('/git/ref/heads/' + $enc)).Json.object.sha }
            catch { if ((Get-HttpStatus $_) -eq 404) { Write-Host "SKIP branch already gone: $name"; continue }; throw }
            if (-not ($tip -ceq $mergedSha)) { Write-Host ("SKIP tip moved since the merge (now {0}): {1}" -f $tip, $name); continue }
            $null = Invoke-GhApi ('/git/refs/heads/' + $enc) 'DELETE'
            Write-Host "DELETED safely merged branch: $name"
          }
