# GitHub Pages deploy for edge-ops.
# Builds _site/ with scripts/Build-Site.ps1 under Windows PowerShell 5.1 and deploys it via GitHub Actions.
# Requires Settings > Pages > Source = GitHub Actions; until then the deploy job fails.
# Note: upload-pages-artifact supports Windows runners (it tars _site with bash/tar --force-local on runner.os == 'Windows').
# Hidden files (e.g. .nojekyll) are left out of the artifact by default; Actions-based Pages deploys skip Jekyll anyway.
name: pages-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # GitHub-hosted Windows: Build-Site.ps1 uses only built-in .NET/PowerShell 5.1, no local tools.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - name: Build _site (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          & .\scripts\Build-Site.ps1 -BasePath '${{ steps.pages.outputs.base_path }}/'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
