<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SCOPE">
  <title>SCOPE</title>
  <circle cx="32" cy="32" r="29.5" fill="#0d2233" stroke="#c9a66b" stroke-width="3"/>
  <!-- the waterline -->
  <path d="M10 45 q5.5 -4.2 11 0 t11 0 t11 0 t11 0" fill="none" stroke="#c9a66b" stroke-width="2.4" stroke-linecap="round"/>
  <!-- the periscope: a shaft rising from the water, its head turned toward the contact -->
  <rect x="26.5" y="22" width="5.5" height="23" fill="#f1e4c8"/>
  <rect x="26.5" y="15" width="21" height="9" rx="2.5" fill="#f1e4c8"/>
  <!-- the lens and its sight picture -->
  <circle cx="45" cy="19.5" r="2.7" fill="#4fb386"/>
  <circle cx="45" cy="19.5" r="6.2" fill="none" stroke="#c9a66b" stroke-width="1.3"/>
  <path d="M45 11.2 v3.2 M45 24.6 v3.2 M36.7 19.5 h3.2 M50.1 19.5 h3.2" stroke="#c9a66b" stroke-width="1.3" stroke-linecap="round"/>
</svg>
