  <circle cx="32" cy="31" r="8.5" fill="none" stroke="#0d2233" stroke-width="2.4"/>
  <circle cx="32" cy="31" r="3.2" fill="#0d2233"/>
  <!-- the gate light: green once a person has said yes -->
  <circle cx="32" cy="31" r="1.6" fill="#4fb386"/>
