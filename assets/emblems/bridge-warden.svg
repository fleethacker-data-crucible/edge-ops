<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Bridge Warden">
  <title>Bridge Warden</title>
  <circle cx="32" cy="32" r="29.5" fill="#0d2233" stroke="#c9a66b" stroke-width="3"/>
  <!-- the warden's shield -->
  <path d="M32 11 L47 16.5 V31 C47 41 40.5 48.5 32 52.5 C23.5 48.5 17 41 17 31 V16.5 Z" fill="#f1e4c8"/>
