<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Halyard Ballast">
  <title>Halyard Ballast</title>
  <circle cx="32" cy="32" r="29.5" fill="#0d2233" stroke="#c9a66b" stroke-width="3"/>
  <!-- Halyard's pennant, flown over the ballast it trims against -->
  <rect x="30" y="10" width="3" height="20" rx="1" fill="#f1e4c8"/>
  <polygon points="33,11 46,15 33,19" fill="#3fb6a8"/>
  <!-- pigs of ballast stacked in the hold: the sandbox -->
  <rect x="15" y="41" width="16" height="7" rx="1.4" fill="#c9a66b"/>
  <rect x="33" y="41" width="16" height="7" rx="1.4" fill="#c9a66b"/>
  <rect x="24" y="32.5" width="16" height="7" rx="1.4" fill="#f1e4c8"/>
  <path d="M15 51 H49" stroke="#9b7a52" stroke-width="2" stroke-linecap="round"/>
</svg>
